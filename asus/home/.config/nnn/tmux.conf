# Minimal tmux used only as a helper for nnn's preview pane (see n() in ~/.zshrc)
set -g status off                     # herdr already shows workspace/tab info
set -g escape-time 0                  # nnn uses Esc; no delay
set -g mouse on                       # click/scroll in the preview pane
set -g default-terminal "tmux-256color"
set -g pane-border-lines single
