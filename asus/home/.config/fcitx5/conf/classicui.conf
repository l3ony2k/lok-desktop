# lok greyscale square themes for fcitx5 (dark/light follow desktop color-scheme)
# NOTE: with UseDarkTheme=True fcitx5 loads DarkTheme in dark mode, Theme in light mode.
Theme=lok-light
DarkTheme=lok-dark
UseDarkTheme=True
UseAccentColor=False
VerticalCandidateList=False
WheelForPaging=True
Font="Sarasa UI SC 10.5"
MenuFont="Sarasa UI SC 10.5"
TrayFont="Noto Sans CJK SC 10"
PerScreenDPI=True
# Show 中 / A icons from the schema instead of a text label
PreferTextIcon=False
ShowLayoutNameInIcon=False