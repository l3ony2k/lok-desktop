# Brave Origin launch flags
# Required for camera access: Chromium talks to xdg-desktop-portal for
# cameras, which needs this feature enabled on Linux.
--enable-features=WebRtcPipeWireCamera
# 2026-11-12: always use gnome-keyring (Secret Service, unlocked by PAM at login).
# Under Plasma, Chromium auto-picks KDE Wallet (via the portal / kwallet6), which
# is not set up here: its dialog blocked Brave and pages hung ("Page Unresponsive").
# Same backend in Hyprland and Plasma keeps cookies and saved passwords readable.
--password-store=gnome-libsecret
