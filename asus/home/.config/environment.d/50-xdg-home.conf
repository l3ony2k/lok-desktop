# Keep $HOME tidy: tools that support it keep their files under the XDG dirs.
# One source for three readers: systemd --user (services, at login), zsh ($ZDOTDIR/.zshenv),
# bash (.profile / .bashrc) and Hyprland (custom/env.lua). Plain KEY=${HOME}/... lines only.
CARGO_HOME=${HOME}/.local/share/cargo
RUSTUP_HOME=${HOME}/.local/share/rustup
NVM_DIR=${HOME}/.local/share/nvm
NPM_CONFIG_CACHE=${HOME}/.cache/npm
GTK2_RC_FILES=${HOME}/.config/gtk-2.0/gtkrc
ICEAUTHORITY=${HOME}/.cache/ICEauthority
