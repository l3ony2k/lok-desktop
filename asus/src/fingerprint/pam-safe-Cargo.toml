[package]
name = "pam-rust-fp-safe"
version = "0.1.0"
edition = "2021"
description = "Defensive rust-fp PAM module: bounded wait, never blocks or crashes the PAM stack"

[lib]
name = "pam_rust_fp_safe"
crate-type = ["cdylib"]

[dependencies]
rust-fp-common = { path = "../common" }
rust-fp = { path = "../rust-fp" }
pam-bindings = "0.1.1"
postcard = "1.0.8"
rmp-serde = "1.3.0"
zbus = "4.3.0"
libc = "0.2"
