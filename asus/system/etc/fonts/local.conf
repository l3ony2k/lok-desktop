<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>
    Chromium/Electron resolve Han fallback through the generic `serif` family, and
    65-nonlatin.conf puts Noto Serif CJK first there. Prepending a Latin serif plus
    a sans CJK makes Han glyphs render sans (Noto Sans CJK SC) while Latin serif
    text keeps a serif face (Noto Serif).
  </description>

  <match target="pattern">
    <test name="family" compare="eq"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Noto Serif</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
</fontconfig>
