[Sleep]
# 2026-11-09: S0ix standby costs ~0.15-0.2 W (overnight test), so stay suspended
# 24 h before hibernating (low battery still hibernates first). On AC power never
# hibernate: the 24 h countdown starts only once the charger is unplugged.
AllowSuspendThenHibernate=yes
HibernateDelaySec=24h
HibernateOnACPower=no
