# 2026-11-08: let pam_rust_fp_safe.so (via /etc/pam.d/polkit-1) read leon's
# fingerprint templates. Everything else in /home stays hidden (tmpfs), file is read-only.
# Delete this drop-in (and /etc/pam.d/polkit-1) to revert.
[Service]
ProtectHome=tmpfs
BindReadOnlyPaths=-/home/leon/.var/cros-fp-templates
