# 2026-11-08: PCIe ASPM policy powersupersave (L1 + L1.1/L1.2 + CLKPM on every
# capable link). Firmware leaves the Realtek RTS522A card reader link (00:06.1 ->
# 02:00.0) with ASPM disabled; the "default" policy keeps that. A/B on RAPL:
# ~130-315 mW lower package power. Rollback: delete this file and reboot.
w /sys/module/pcie_aspm/parameters/policy - - - - powersupersave
