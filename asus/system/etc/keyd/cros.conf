[main]

# Chromebook keyboard swap and CapsLock+ navigation:
#   caps-lock-position key -> Escape when tapped, CapsLock+ layer when held
#                           (ChromeOS Search key emits KEY_LEFTMETA)
#   left alt              -> Super       (layer(meta))
#   right alt             -> unchanged   (AltGr)
#
# The CapsLock+ layer deliberately does not remap clipboard keys: this machine
# has only one clipboard. It does map Space -> Enter and Backspace -> delete
# line, keeping Ctrl+Space as fcitx5's IME trigger key via the
# [control+capslock] composite layer below.
#
# Top-row media keys (back, refresh, zoom, scale, sysrq, brightness*,
# mute, volume*) are NOT remapped here: unbound keys pass through
# untouched, so pressing one alone gives its media function.
#
# Function keys F1..F10 come from Super + media key (see [meta]).
# Keyboard backlight = right alt + brightness keys (see [altgr]).
leftmeta = overload(capslock, esc)
leftalt = layer(meta)

[capslock]
# Navigation: physical CapsLock-position key + letter.
e = up
d = down
s = left
f = right

# Coarse movement and word movement.
t = macro(up up up up up up up up up up)
b = macro(down down down down down down down down down down)
a = C-left
g = C-right

# Line boundaries.
p = home
semicolon = end

# Selection.
i = S-up
k = S-down
j = S-left
l = S-right
y = macro(S-up S-up S-up S-up S-up S-up S-up S-up S-up S-up)
n = macro(S-down S-down S-down S-down S-down S-down S-down S-down S-down S-down)
h = C-S-left
dot = C-S-right
u = S-home
o = S-end

# Deletion: single character, plus whole-line deletion on +Backspace.
# Clipboard and page deletion stay unbound.
w = backspace
r = delete
backspace = macro(home S-down delete)

# Voice input (fcitx5-vinput via XKB XF86Launch5..7; leaves Alt_R/Control_R/Shift_R free).
v = f14
m = f15
c = f16

# Space -> Enter while the layer is held. Ctrl+Space must remain the IME
# toggle, so [control+capslock] re-emits it explicitly instead of letting it
# fall through to this binding.
space = enter

# Firmware that reports the top row as F keys rather than media keys.
f1 = f1
f2 = f2
f3 = f3
f4 = f4
f5 = f5
f6 = f6
f7 = f7
f8 = f8
f9 = f9
f10 = f10

f13=coffee
sleep=coffee

[meta]
# Super + media key -> the corresponding function key.
back = f1
refresh = f2
zoom = f3
scale = f4
sysrq = f5
brightnessdown = f6
brightnessup = f7
mute = f8
volumedown = f9
volumeup = f10

# Firmware that reports the top row as F keys: Super + F key stays F key.
f1 = f1
f2 = f2
f3 = f3
f4 = f4
f5 = f5
f6 = f6
f7 = f7
f8 = f8
f9 = f9
f10 = f10


[alt]
# Left alt is Super on this machine, so this layer is normally unreachable;
# kept so the [control+alt] composite below has a valid constituent.
backspace = delete
brightnessdown = kbdillumdown
brightnessup = kbdillumup
f6 = kbdillumdown
f7 = kbdillumup

[control]
f5 = sysrq
scale = sysrq

# Composite layers restore the pre-existing meaning of modified Space and
# Backspace while the CapsLock layer is held. Bindings ignore the modifiers of
# the layer they are defined in, so every modifier is written out explicitly.
[control+capslock]
# fcitx5 trigger key (default Control+space), and delete-word on Backspace.
space = C-space
backspace = C-backspace

[shift+capslock]
# e.g. full-width space in Rime, as without the layer.
space = S-space

[control+shift+capslock]
space = C-S-space

[altgr]
backspace = delete
left = home
right = end
up = pageup
down = pagedown

# Right alt + brightness keys -> keyboard backlight (`chromeos::kbd_backlight`).
# keyd runs as root and executes these through /bin/sh.
brightnessdown = command(/usr/bin/brightnessctl -q -d chromeos::kbd_backlight set 10%-)
brightnessup = command(/usr/bin/brightnessctl -q -d chromeos::kbd_backlight set 10%+)

[control+alt]
backspace = C-A-delete
f1 = C-A-f1
f2 = C-A-f2
f3 = C-A-f3
f4 = C-A-f4
f5 = C-A-f5
f6 = C-A-f6
f7 = C-A-f7
f8 = C-A-f8
f9 = C-A-f9
f10 = C-A-f10
back = C-A-f1
refresh = C-A-f2
zoom = C-A-f3
scale = C-A-f4
sysrq = C-A-f5
brightnessdown = C-A-f6
brightnessup = C-A-f7
mute = C-A-f8
volumedown = C-A-f9
volumeup = C-A-f10

[control+altgr]
# VT switching: Ctrl + right Alt + top-row key -> Ctrl+Alt+F1..F10.
# Left alt is Super here, so the [control+alt] layer above cannot be reached;
# this composite only fires while BOTH control and right alt are held, so
# plain right-alt bindings ([altgr]) and Ctrl shortcuts are unaffected.
# Desktop (greetd/Hyprland) is on tty1 = back key.
back = C-A-f1
refresh = C-A-f2
zoom = C-A-f3
scale = C-A-f4
sysrq = C-A-f5
brightnessdown = C-A-f6
brightnessup = C-A-f7
mute = C-A-f8
volumedown = C-A-f9
volumeup = C-A-f10
# Firmware that reports the top row as F keys.
f1 = C-A-f1
f2 = C-A-f2
f3 = C-A-f3
f4 = C-A-f4
f5 = C-A-f5
f6 = C-A-f6
f7 = C-A-f7
f8 = C-A-f8
f9 = C-A-f9
f10 = C-A-f10
