# 2026-11-08: drive the Meteor Lake iGPU (8086:7d45) with xe instead of i915 (kept after testing).
# Why: with i915 the media GT stays in RC0 after a hibernate resume (no S0ix/PC10 until reboot); xe does not.
# Revert: delete this file and reboot (i915/xe are not in the initramfs, no rebuild needed).
options i915 force_probe=!7d45
options xe force_probe=7d45
