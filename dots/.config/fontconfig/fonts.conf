<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Generated by system-font; change fonts with system-font, not this file. -->
  <match target="font">
    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
  </match>
  <alias binding="same">
    <family>system-ui</family>
    <prefer>
      <family>sans-serif</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>ui-sans-serif</family>
    <prefer>
      <family>sans-serif</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>ui-serif</family>
    <prefer>
      <family>serif</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>ui-monospace</family>
    <prefer>
      <family>monospace</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Helvetica</family>
    <prefer>
      <family>sans-serif</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Arial</family>
    <prefer>
      <family>sans-serif</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Times</family>
    <prefer>
      <family>serif</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Times New Roman</family>
    <prefer>
      <family>serif</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Courier New</family>
    <prefer>
      <family>monospace</family>
    </prefer>
  </alias>
  <match target="pattern">
    <test name="family" compare="eq" qual="any">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <if>
        <contains>
          <name>lang</name>
          <string>ja</string>
        </contains>
        <string>Sarasa UI J</string>
        <if>
          <contains>
            <name>lang</name>
            <string>ko</string>
          </contains>
          <string>Sarasa UI K</string>
          <if>
            <contains>
              <name>lang</name>
              <string>zh-tw</string>
            </contains>
            <string>Sarasa UI TC</string>
            <if>
              <contains>
                <name>lang</name>
                <string>zh-hk</string>
              </contains>
              <string>Noto Sans CJK HK</string>
              <if>
                <contains>
                  <name>lang</name>
                  <string>zh-mo</string>
                </contains>
                <string>Noto Sans CJK HK</string>
                <string>Sarasa UI SC</string>
              </if>
            </if>
          </if>
        </if>
      </if>
      <string>Noto Sans CJK SC</string>
      <string>Noto Color Emoji</string>
      <string>Noto Emoji</string>
    </edit>
    <edit name="genericfamily" mode="delete_all" />
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <if>
        <contains>
          <name>lang</name>
          <string>ja</string>
        </contains>
        <string>Noto Serif CJK JP</string>
        <if>
          <contains>
            <name>lang</name>
            <string>ko</string>
          </contains>
          <string>Noto Serif CJK KR</string>
          <if>
            <contains>
              <name>lang</name>
              <string>zh-tw</string>
            </contains>
            <string>Noto Serif CJK TC</string>
            <if>
              <contains>
                <name>lang</name>
                <string>zh-hk</string>
              </contains>
              <string>Noto Serif CJK HK</string>
              <if>
                <contains>
                  <name>lang</name>
                  <string>zh-mo</string>
                </contains>
                <string>Noto Serif CJK HK</string>
                <string>Noto Serif CJK SC</string>
              </if>
            </if>
          </if>
        </if>
      </if>
      <string>Noto Serif CJK SC</string>
      <string>Noto Color Emoji</string>
      <string>Noto Emoji</string>
    </edit>
    <edit name="genericfamily" mode="delete_all" />
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>IoskeleyMonoTerm Nerd Font</string>
      <if>
        <contains>
          <name>lang</name>
          <string>ja</string>
        </contains>
        <string>Sarasa Mono J</string>
        <if>
          <contains>
            <name>lang</name>
            <string>ko</string>
          </contains>
          <string>Sarasa Mono K</string>
          <if>
            <contains>
              <name>lang</name>
              <string>zh-tw</string>
            </contains>
            <string>Sarasa Mono TC</string>
            <if>
              <contains>
                <name>lang</name>
                <string>zh-hk</string>
              </contains>
              <string>Noto Sans Mono CJK HK</string>
              <if>
                <contains>
                  <name>lang</name>
                  <string>zh-mo</string>
                </contains>
                <string>Noto Sans Mono CJK HK</string>
                <string>Sarasa Mono SC</string>
              </if>
            </if>
          </if>
        </if>
      </if>
      <string>Noto Color Emoji</string>
      <string>Noto Emoji</string>
    </edit>
    <edit name="genericfamily" mode="delete_all" />
  </match>
</fontconfig>
