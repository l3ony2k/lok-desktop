# hyprlock config for this machine (asus-arch-ops 2026-11-12).
# Lives in custom/ so dots updates keep it; ~/.local/bin/hyprlock passes it with -c.
# Based on the dots' ~/.config/hypr/hyprlock.conf, plus:
#   - fingerprint via net.reactivated.Fprint (rust-fp-fprintd shim), in parallel with password
#   - empty Enter is ignored (no wasted pam_faillock attempt)
#   - dropped the caps-lock and status labels: their scripts are not on this machine
#   - all text in the system monospace (Ioskeley Mono); clock 130 Bold, date 30
#     SemiBold (5 clock chars x 130 ~ 21 date chars x 30, so both are about the
#     same width), small text Regular; user bottom-left, layout bottom-right

source = ~/.config/hypr/hyprlock/colors.conf

$font_family = monospace
# hyprlock takes font_family as a family name only ("monospace Bold" is not
# bold), so weights are set with Pango markup in the label text.
$font_family_clock = monospace
$font_family_date = monospace

general {
    ignore_empty_input = true
}

auth {
    pam {
        enabled = true
    }
    fingerprint {
        enabled = true
        ready_message = Touch the fingerprint sensor or type your password
        present_message = Scanning...
        retry_delay = 250
    }
}

background {
    color = rgba(000000FF)
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.1
    dots_spacing = 0.3
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    fade_on_empty = true
    placeholder_text = <i>Password</i>
    font_family = $font_family
    capslock_color = rgba(E5A50AFF)

    position = 0, 20
    halign = center
    valign = center
}

label { # Fingerprint failure (empty unless a finger was rejected)
    monitor =
    text = $FPRINTFAIL
    color = $text_color
    font_size = 13
    font_family = $font_family
    position = 0, -40
    halign = center
    valign = center
}

label { # Keyboard layout, bottom-right
    monitor =
    text = $LAYOUT
    color = $text_color
    font_size = 14
    font_family = $font_family
    position = -30, 30
    halign = right
    valign = bottom
}

label { # Clock
    monitor =
    text = <span font_weight="700">$TIME</span>
    color = $text_color
    font_size = 130
    font_family = $font_family_clock
    position = 0, 300
    halign = center
    valign = center
}

label { # Date
    monitor =
    text = cmd[update:5000] echo "<span font_weight='600'>$(date +'%A, %B %d')</span>"
    color = $text_color
    font_size = 30
    font_family = $font_family_date
    position = 0, 185
    halign = center
    valign = center
}

label { # User, bottom-left (mirrors the layout label)
    monitor =
    text = $USER
    color = $text_color
    font_size = 14
    font_family = $font_family
    position = 30, 30
    halign = left
    valign = bottom
}
